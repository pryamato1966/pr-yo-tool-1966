function showToast(msg) {
    const toast = document.createElement("div");
    toast.textContent = msg;
    toast.style.position = "fixed";
    toast.style.bottom = "20px";
    toast.style.left = "50%";
    toast.style.transform = "translateX(-50%)";
    toast.style.background = "#333";
    toast.style.color = "#fff";
    toast.style.padding = "10px 20px";
    toast.style.borderRadius = "8px";
    toast.style.zIndex = "9999";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 1500);
}

	const STORAGE_KEY = "yahuoku_form_v1";
	
	function saveFormData() {

    const data = {};

    document
        .querySelectorAll("input, textarea, select")
        .forEach(el => {

            if (!el.id) return;

            if (el.type === "checkbox") {
                data[el.id] = el.checked;
            } else {
                data[el.id] = el.value;
            }
        });

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

function restoreFormData() {

    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) return false;

    const data = JSON.parse(raw);

    Object.keys(data).forEach(id => {

        const el = document.getElementById(id);

        if (!el) return;

        if (el.type === "checkbox") {
            el.checked = data[id];
        } else {
            el.value = data[id];
        }
    });

    updateShippingMethod();

    return true;
}

function resetFormData() {

    if (!confirm("保存された入力内容を削除しますか？")) {
        return;
    }

    localStorage.removeItem(STORAGE_KEY);

    location.reload();
}
// --- 全角英数字入力を自動で半角に変換、数字・ドット以外を除外するガード用関数 ---
function convertZenToHan(element) {
    let value = element.value;
    // 全角英数字を半角に変換
    value = value.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    });
    // 数字、ドット以外を除外（管理番号やサイズ入力用）
    if (element.id === 'dateInput' || element.id === 'serialInput') {
        value = value.replace(/[^0-9]/g, '');
    } else {
        value = value.replace(/[^0-9.]/g, '');
    }
    element.value = value;
}

window.onload = function() {

    const shipSelect =
        document.getElementById('shippingMethod');

    shippingMaster.forEach((item, index) => {

        let opt = document.createElement('option');

        opt.value = index;
        opt.textContent = item.name;

        shipSelect.appendChild(opt);
    });

    const restored = restoreFormData();

    if (!restored) {

        const now = new Date();

        const yy =
            String(now.getFullYear()).slice(-2);

        const mm =
            String(now.getMonth() + 1)
            .padStart(2, '0');

        const dd =
            String(now.getDate())
            .padStart(2, '0');

        document.getElementById('dateInput').value =
            yy + mm + dd;
    }

    updateShippingMethod();
};

function updateShippingMethod() {
    const idx = document.getElementById('shippingMethod').value;
    const selected = shippingMaster[idx];
    const feeInput = document.getElementById('shippingFee');
    
    let textValue = "";
    if (selected.fee === 0) {
        textValue = "0円 (変動有り)";
    } else {
        textValue = selected.fee + "円";
    }
    
    feeInput.value = textValue;
    feeInput.size = Math.max(textValue.length + 1, 4);
}

function generateOutput() {
    const yahooId = document.getElementById('yahooId').value;
    const dateStr = document.getElementById('dateInput').value.trim();
    
    let serialStr = document.getElementById('serialInput').value.trim();
    if (serialStr !== "") {
        serialStr = serialStr.padStart(3, '0');
    }

    const memoStr = document.getElementById('memoInput').value.trim();
    const mainCat = document.getElementById('mainCategory').value;
    const titleDetail = document.getElementById('titleDetail').value.trim();
    const specialNote = document.getElementById('specialNote').value.trim();
    
    const h = document.getElementById('sizeH').value.trim() || "-";
    const w = document.getElementById('sizeW').value.trim() || "-";
    const d = document.getElementById('sizeD').value.trim() || "-";
    const wg = document.getElementById('sizeWeight').value.trim() || "-";
    
    const shipIdx = document.getElementById('shippingMethod').value;
    const selectedShip = shippingMaster[shipIdx];
    const shippingSize = document.getElementById('shippingSize').value;

    const isAMA = document.getElementById('chkAMA').checked;
    const isZI = document.getElementById('chkZI').checked;

    // タイトル生成
    document.getElementById('outTitle').value = `【${mainCat}】 ${titleDetail}`;

    // 説明文生成
    let textParts = [];

    // ① 共通冒頭文
    textParts.push(block1_1 + "</div><BR>");

    // ② 大分類連動説明文（ブロック3）
    const block3Id = categoryMapping[mainCat];
    const block3Text = block3_master[block3Id] || "";
    textParts.push(block3Text + "<BR>");

    // ③ 特記
    if (specialNote) {
 		textParts.push(`<div><u>★${specialNote}</u></div><BR>`);
    }

    // ④ 管理番号ブロック
    let managerNo = `${dateStr} ${serialStr} ${selectedShip.code}`;
    
    if (shippingSize !== "なし") {
        managerNo += ` ～${shippingSize}㎝`;
    }
    if (isAMA) managerNo += " AMA";
    if (isZI) managerNo += " ZI";
    if (memoStr) {
        managerNo += ` ${memoStr}`;
    }

    let block4_1 = `<BR><div>◇梱包サイズ(約)：高さ(H)：${h}㎝ 幅(W)：${w}㎝ 奥行(D)：${d}㎝ 重さ：${wg}㎏<BR>◇管理番号：${managerNo}</div><BR>`;

    // ⑤ 発送別説明文（ブロック6）
    const block6Text = block6_master[selectedShip.block6Id] || "";
    if (block6Text) {

    const banner1 = `<div><A TARGET="_new" HREF="https://buyee.jp/ya/${yahooId}?rc=yaucs"><IMG SRC="https://buyee.jp/images/common/guide/seller/seller_banner/en/v2/566x100.jpg" /></A></div><br><br>`;

    textParts.push(banner1 + banner2);

    document.getElementById('outDescription').value = textParts.join("\n");
}

function copyToClipboard(elementId) {
    const copyText = document.getElementById(elementId);
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(copyText.value);
    showToast("コピーしました");
}
